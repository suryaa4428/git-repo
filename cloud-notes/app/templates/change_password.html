<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🔐 Change Password</h1>

    <form method="POST">

        <input
            type="password"
            name="old_password"
            placeholder="Current Password"
            required>

        <br><br>

        <input
            type="password"
            name="new_password"
            placeholder="New Password"
            required>

        <br><br>

        <button type="submit">
            Change Password
        </button>

    </form>

    <br>

    <a href="/profile">⬅ Back</a>

</div>

</body>
</html>
