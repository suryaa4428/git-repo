services:
  cloud-notes:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    volumes:
      - ./app/static/uploads:/app/static/uploads

  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: suryaa123
      MYSQL_DATABASE: cloudlab
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
